<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="description" content="Fulbo a Bologna: encuesta de perfiles, cartas de jugador y equipos parejos para el 7 contra 7.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fulbo">
<title>Fulbo a Bologna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Kaushan+Script&family=Noto+Sans:wght@400;500;600;700&family=Noto+Color+Emoji&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: planilla de vestuario — lista de plantel a la izquierda, dos columnas de equipo (con / sin pechera) al centro, ficha del jugador a la derecha */
:root{
  --bg:#edf1ec; --surface:#ffffff; --surface-2:#f5f7f4; --ink:#16201a; --muted:#5d6a61; --line:#d4dcd2;
  --pitch:#1d6b3b; --pitch-soft:#dcebdf; --bib:#f2621a; --bib-soft:#fde4d6; --nobib:#2b3d93; --nobib-soft:#dfe4f7;
  --good:#1d7a45; --warn:#b7791f; --bad:#c2412d; --grass1:#2f8a4c; --grass2:#2a7f45;
  --f-display:"Archivo","Arial Narrow",Impact,sans-serif;
  --f-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1410; --surface:#161e19; --surface-2:#1c2620; --ink:#e5ece6; --muted:#93a198; --line:#2b372f;
  --pitch:#55c27f; --pitch-soft:#1d3326; --bib:#ff7d3a; --bib-soft:#3a2418; --nobib:#93a6ff; --nobib-soft:#1f2645;
  --good:#5ccf8b; --warn:#e2b04f; --bad:#ff7d68; --grass1:#1f5e34; --grass2:#1b5530; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1410; --surface:#161e19; --surface-2:#1c2620; --ink:#e5ece6; --muted:#93a198; --line:#2b372f;
  --pitch:#55c27f; --pitch-soft:#1d3326; --bib:#ff7d3a; --bib-soft:#3a2418; --nobib:#93a6ff; --nobib-soft:#1f2645;
  --good:#5ccf8b; --warn:#e2b04f; --bad:#ff7d68; --grass1:#1f5e34; --grass2:#1b5530; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding:0 16px 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 14px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-size:40px;font-weight:800;line-height:.9;text-transform:uppercase}
.brand h1 span{color:var(--bib)}
.brand small{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:8px 14px;font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-radius:6px 6px 0 0;position:relative}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-16px;height:4px;background:var(--bib)}
.banner{margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--bib-soft);display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner p{margin:0}

/* generic */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pitch);border-color:var(--pitch);color:var(--surface)}
.btn.bib{background:var(--bib);border-color:var(--bib);color:#fff}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.danger{color:var(--bad)}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:120px;resize:vertical}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.warn{color:var(--warn);border-color:currentColor;background:none}
.pill.hot{color:var(--bad);border-color:currentColor;background:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ARMAR */
.armar{display:grid;grid-template-columns:290px minmax(0,1fr) 270px;gap:16px;margin-top:18px;align-items:start}
@media (max-width:1060px){.armar{grid-template-columns:260px minmax(0,1fr)}.armar .ficha{grid-column:1/-1}}
@media (max-width:720px){.armar{grid-template-columns:minmax(0,1fr)}}
.lista h2{font-size:22px}
.count{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1}
.count.ok{color:var(--pitch)}
.plist{list-style:none;margin:10px 0 0;padding:0;max-height:430px;overflow:auto;border-top:1px solid var(--line)}
.plist li{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line)}
.plist li.on{background:var(--pitch-soft)}
.plist label{flex:1;min-width:0;display:flex;align-items:center;gap:8px;cursor:pointer}
.plist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .lvl{font-family:var(--f-display);font-weight:700;font-size:16px;width:30px;text-align:right}
.plist input[type=checkbox]{width:18px;height:18px;accent-color:var(--pitch);flex:none}
.info-btn{border:0;background:none;color:var(--muted);padding:2px 6px;border-radius:4px}
.info-btn:hover{background:var(--surface-2);color:var(--ink)}
details.paste{margin-top:10px}
details.paste summary{cursor:pointer;font-weight:600;font-size:14px}
details.paste textarea{margin-top:8px;min-height:110px}

.cancha{min-width:0}
.cancha-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.opts{display:flex;gap:4px;flex-wrap:wrap}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
.opts button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.teams{grid-template-columns:1fr}}
.team{border-radius:var(--r);border:2px solid var(--line);background:var(--surface);min-height:200px;display:flex;flex-direction:column}
.team.A{border-color:var(--bib)}
.team.B{border-color:var(--nobib)}
.team.drag-over{box-shadow:0 0 0 4px var(--pitch-soft)}
.team-h{padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.team.A .team-h{background:var(--bib-soft)}
.team.B .team-h{background:var(--nobib-soft)}
.team-h h3{font-size:22px;text-transform:uppercase;font-weight:800}
.team.A h3{color:var(--bib)} .team.B h3{color:var(--nobib)}
.team-h .avg{font-family:var(--f-display);font-size:26px;font-weight:800}
.chips{list-style:none;margin:0;padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.chip{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:grab;user-select:none}
.chip.sel{outline:2px solid var(--pitch)}
.chip .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chip .bar{width:44px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.chip .bar i{display:block;height:100%;background:var(--pitch)}
.chip .lvl{font-family:var(--f-display);font-weight:700;width:26px;text-align:right}
.chip .mv{border:0;background:none;color:var(--muted);font-size:16px;padding:0 4px;line-height:1}
.chip .mv:hover{color:var(--ink)}
.tags{display:flex;gap:4px}
.metrics{margin-top:14px;overflow-x:auto}
.metrics table{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
.metrics th,.metrics td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
.metrics th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.metrics td:first-child,.metrics th:first-child{text-align:left}
.metrics td.a{color:var(--bib);font-weight:700} .metrics td.b{color:var(--nobib);font-weight:700}
.dif{font-weight:700}
.dif.g{color:var(--good)} .dif.w{color:var(--warn)} .dif.x{color:var(--bad)}
.verdict{display:flex;align-items:center;gap:14px;margin-top:12px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);flex-wrap:wrap}
.verdict .big{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1}
.warns{margin:8px 0 0;padding-left:18px;color:var(--warn);font-size:14px}
.cancha-empty{border:2px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted)}
.cancha-empty strong{display:block;font-family:var(--f-display);font-size:24px;color:var(--ink);text-transform:uppercase;margin-bottom:4px}

.ficha h2{font-size:26px;text-transform:uppercase;font-weight:800;line-height:1}
.ficha .sub{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.fuerza{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.fuerza b{font-family:var(--f-display);font-size:42px;line-height:1;font-weight:800}
.grp{margin-top:10px}
.grp .label{margin-bottom:4px;display:block}
.attr{display:grid;grid-template-columns:110px 1fr 30px;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.attr .track{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.attr .track i{display:block;height:100%;background:var(--pitch)}
.attr.hot .track i{background:var(--bad)}
.attr .v{text-align:right;font-weight:600}

.partidos{margin-top:22px}
.partidos h3{font-size:20px;text-transform:uppercase}
.match{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.match .who{min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .res{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.match input{width:54px;padding:4px 6px;text-align:center}
.match select{width:auto;padding:4px 6px}
@media (max-width:620px){.match{grid-template-columns:1fr}}

/* ENCUESTA */
.enc{max-width:760px;margin:22px auto 0}
.enc .intro h2{font-size:32px;text-transform:uppercase;font-weight:800}
.enc .intro p{max-width:62ch;color:var(--muted)}
.steps{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card + .card{margin-top:12px}
.who-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.eval-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:6px}
.eval-h h2{font-size:36px;text-transform:uppercase;font-weight:800;line-height:.95}
.prog{display:flex;gap:4px}
.prog i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.prog i.done{background:var(--pitch)} .prog i.cur{background:var(--bib)}
.qgrp{margin-top:16px}
.qgrp > .label{display:block;padding-bottom:4px;border-bottom:1px solid var(--line)}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.q .qn{font-weight:700}
.q .qn small{font-weight:500;color:var(--bad);margin-left:6px}
.q .anch{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
.q .anch span:last-child{text-align:right}
.scale{display:flex;gap:4px}
.scale button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-size:19px;font-weight:700}
.scale button[aria-pressed="true"]{background:var(--pitch);color:var(--surface);border-color:var(--pitch)}
.q.inv .scale button[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
@media (max-width:520px){.q{grid-template-columns:1fr}.scale button{width:auto;flex:1}}
.eval-f{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}

/* PLANTEL */
.plantel{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;margin-top:18px;align-items:start}
@media (max-width:900px){.plantel{grid-template-columns:minmax(0,1fr)}}
.ptable-wrap{overflow-x:auto}
.ptable{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.ptable th,.ptable td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.ptable th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ptable input[type=text]{padding:5px 8px}
.ptable select{padding:5px 6px;width:auto}
.ptable tr.off td{opacity:.55}
.side h3{font-size:20px;text-transform:uppercase;margin-bottom:6px}
.side .panel + .panel{margin-top:12px}
.pairs{list-style:none;padding:0;margin:8px 0 0}
.pairs li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
/* avatares */
.av{flex:none;width:28px;height:28px;border-radius:50%;overflow:hidden;display:inline-grid;place-items:center;background:var(--av,#557);color:#fff;font-weight:700;font-size:11px;letter-spacing:.02em;font-family:var(--f-body)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:64px;height:64px;font-size:22px}
.av.md{width:40px;height:40px;font-size:14px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:4px;vertical-align:middle}
/* pegar */
.paste-card{margin-top:12px;padding:12px;border-radius:8px;background:var(--pitch-soft)}
.paste-card textarea{min-height:120px;margin-top:6px;background:var(--surface)}
.or{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.or::after{content:"";flex:1;height:1px;background:var(--line)}
/* canchita */
.pitch-wrap{margin-bottom:12px}
.pitch-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:13px}
.pitch-bar label{display:flex;align-items:center;gap:6px}
.pitch-bar select{width:auto;padding:4px 8px}
.pitch{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:repeating-linear-gradient(90deg,var(--grass1) 0 10%,var(--grass2) 10% 20%)}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.pitch svg.v{display:none}
.half{position:absolute;top:0;bottom:0;width:50%}
.half.A{left:0}.half.B{right:0}
.half.drag-over{background:rgba(255,255,255,.12)}
.mk{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:grab;width:76px;z-index:1}
.mk .av{width:38px;height:38px;font-size:13px;box-shadow:0 0 0 3px var(--ring)}
.mk.A{--ring:var(--bib)}.mk.B{--ring:#ffffff}
.mk.gk .av{box-shadow:0 0 0 3px var(--ring),0 0 0 6px #ffd23f}
.mk .n{position:absolute;top:-6px;right:14px;background:#101512;color:#fff;font-family:var(--f-display);font-weight:800;font-size:12px;line-height:1;padding:3px 5px;border-radius:99px}
.mk .t{font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.mk.sel .av{outline:3px solid #ffd23f;outline-offset:3px}
@media (max-width:640px){
 .pitch{aspect-ratio:10/15;background:repeating-linear-gradient(180deg,var(--grass1) 0 10%,var(--grass2) 10% 20%)}
 .pitch svg.h{display:none}.pitch svg.v{display:block}
 .half{width:auto;left:0;right:0;height:50%}.half.A{top:0;bottom:auto}.half.B{bottom:0;top:auto}
 .mk{left:calc(var(--y)*1%);top:calc(var(--x)*1%)}
}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.chip .no{font-family:var(--f-display);font-weight:800;font-size:15px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.chip .no.gk{background:#ffd23f;border-color:#ffd23f;color:#111}
.chip .rol{font-size:11px;font-weight:700;color:var(--muted);width:28px;flex:none}
/* plantel extra */
.photo-ask{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px;border-radius:var(--r);background:var(--bib-soft);margin-bottom:12px}
.photo-ask h3{font-size:22px;text-transform:uppercase}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pname{display:flex;align-items:center;gap:8px;font-weight:600}
.prow{cursor:pointer}
.prow:hover td{background:var(--surface-2)}
.prow.selrow td{background:var(--pitch-soft)}
.prow .edit{opacity:0;padding:2px 8px}
.prow:hover .edit,.prow.selrow .edit,.prow .edit:focus-visible{opacity:1}
@media (hover:none){.prow .edit{opacity:.6}}
.rules{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.rules .row select{flex:1;min-width:0;width:auto}
.addone{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;z-index:10;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.scale button{transition:background-color .12s,border-color .12s}}
/* --- ronda 3 --- */
:root{--sel:#12a15a;--lv0:#c2412d;--lv1:#b7791f;--lv2:#6aa84f;--lv3:#1d7a45}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sel:#3ddc84;--lv0:#ff7d68;--lv1:#e2b04f;--lv2:#9fd27f;--lv3:#5ccf8b}}
:root[data-theme="dark"]{--sel:#3ddc84;--lv0:#ff7d68;--lv1:#e2b04f;--lv2:#9fd27f;--lv3:#5ccf8b}
header.top .right{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.me-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px 4px 4px;font-weight:600;font-size:14px;margin-bottom:4px}
.me-btn[aria-current="page"]{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel)}
.flag{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;line-height:1}
/* selección con anillo verde */
.mk.sel .av{outline:3px solid var(--sel);outline-offset:3px}
.mk:hover .av{outline:3px solid color-mix(in srgb,var(--sel) 45%,transparent);outline-offset:3px}
.chip.sel{outline:2px solid var(--sel);outline-offset:1px;border-color:var(--sel)}
.chip:hover{border-color:var(--sel)}

.vbar.lv0 i{background:var(--lv0)}.vbar.lv1 i{background:var(--lv1)}.vbar.lv2 i{background:var(--lv2)}.vbar.lv3 i{background:var(--lv3)}

/* carta */
.pcard{width:100%;max-width:290px;margin:0 auto;aspect-ratio:5/7.5;perspective:1200px;cursor:pointer;--t1:#d9b44a;--t2:#f2dc8f;--tink:#3a2a05;border-radius:14px}
.pcard.plata{--t1:#a9b3bc;--t2:#e6ebef;--tink:#1e2429}

@media (prefers-reduced-motion:no-preference){.pc-in{transition:transform .55s cubic-bezier(.3,.7,.3,1)}}

.pc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:14px;display:flex;flex-direction:column;background:linear-gradient(165deg,#1a2b20 0%,#0e1812 100%);color:#f1f5f0;border:4px solid var(--t1);box-shadow:0 12px 26px rgba(0,0,0,.28);overflow:hidden}
.pc-face::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.5px);background-size:7px 7px;pointer-events:none}
.pc-face::after{content:"";position:absolute;right:-28%;top:-20%;width:55%;height:150%;background:linear-gradient(180deg,var(--t1),var(--t2));opacity:.18;transform:rotate(16deg);pointer-events:none}
.pc-face > *{position:relative;z-index:1}
.pc-back{transform:rotateY(180deg)}
.pc-top{display:flex;gap:10px;align-items:flex-start}
.pc-side{display:flex;flex-direction:column;align-items:center;gap:5px;width:56px;flex:none}
.pc-r{font-family:var(--f-display);font-size:50px;line-height:.85;font-weight:800;color:var(--t2)}
.pc-pos{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:.06em}
.pc-side .flag{font-size:24px}
.pc-dor{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--t2)}
.pc-photo{flex:1;min-width:0;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--av);display:grid;place-items:center;border:2px solid var(--t1)}

.seal{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--t1);color:var(--tink);font-size:12px;margin-left:6px;vertical-align:3px;font-family:var(--f-body)}
.pc-stats{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;margin-top:10px}

.pc-tier{align-self:center;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.2em;font-size:13px;color:var(--t2)}

/* mi ficha */

 --good:#23843d;--warn:#b86f00;--bad:#d02c27;--grass1:#33ac50;--grass2:#2e9f4a;--sel:#33ac50;
 --lv0:#d02c27;--lv1:#ea4529;--lv2:#8fbb2c;--lv3:#23843d;--gk:#dfe646;--rank:#e4295d;--card1:#29286d;--card2:#0d0c2e}

.top .brand{align-items:center;gap:16px}
.top .brand .crest{width:96px;height:auto;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.top .brand h1.wm{font-family:var(--f-script);font-weight:400;font-stretch:normal;font-variation-settings:normal;font-size:46px;line-height:1;color:var(--pitch);text-transform:none;letter-spacing:0;transform:rotate(-4deg);transform-origin:left bottom}
.top .brand .motto{display:block;margin-top:10px;font-family:var(--f-display);font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--ink);opacity:.85}
nav.tabs button{font-family:var(--f-display);font-weight:500;letter-spacing:.12em;color:#c7c2b6}
nav.tabs button[aria-selected="true"]{color:var(--pitch)}
nav.tabs button[aria-selected="true"]::after{background:var(--pitch);bottom:-20px}
.me-btn{background:rgba(15,19,27,.8);border-color:var(--line);color:var(--ink)}
.btn{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.btn.bib,.btn.primary{background:var(--pitch);border-color:var(--pitch);color:#07090d}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.label{letter-spacing:.18em}
.panel,.card{background:var(--surface);border-color:var(--line)}
.paste-card{background:var(--pitch-soft)}
.pc-face{background:repeating-linear-gradient(90deg,rgba(51,88,230,.20) 0 12%,transparent 12% 24%),linear-gradient(165deg,var(--card1) 0%,var(--card2) 100%)}
.mk.B{--ring:#ece5d3}
.team.A .team-h h3{color:var(--bib)} .team.B .team-h h3{color:var(--nobib)}
.team.B{border-color:#cfc6af}
.metrics td.a{color:var(--bib)} .metrics td.b{color:var(--nobib)}
.verdict .big.g,.dif.g{color:var(--good)}
.review{background:#2a1f10;border-color:var(--pitch)}
.rv1{border-top-color:rgba(201,162,75,.25)}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.plist li.on{background:var(--pitch-soft)}
.chip{background:var(--surface-2);border-color:var(--line)}
.toast{background:var(--pitch);color:#07090d}
@media (max-width:620px){
 header.top.hero{min-height:0;padding:14px;background-position:70% 30%}
 .top .brand .crest{width:62px}
 .top .brand h1.wm{font-size:32px}
 .top .brand .motto{font-size:10px;letter-spacing:.25em;margin-top:6px}
 nav.tabs button[aria-selected="true"]::after{bottom:-8px}
}
@media (max-width:420px){nav.tabs button{letter-spacing:.03em;font-size:13px;padding:8px 5px}}

/* --- ronda 6 --- */
.b2-wrap{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 18px;margin-top:12px}
.b2-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.b2-h .label{font-size:11px}
.b2-v{font-family:var(--f-display);font-size:15px;color:var(--ink);white-space:nowrap}
.b2-t{position:relative;height:10px;border-radius:5px;background:#1a2236;overflow:hidden}
.b2-t i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--pitch)}
.b2-t b{position:absolute;top:0;bottom:0;width:2px;background:rgba(7,9,13,.7)}
.b2.lv0 .b2-t i{background:var(--lv0)}.b2.lv1 .b2-t i{background:var(--lv1)}.b2.lv2 .b2-t i{background:var(--lv2)}.b2.lv3 .b2-t i{background:var(--lv3)}
.b2-t.thick{height:14px;border-radius:7px}
.vtrack{height:8px;border:0;background:#1a2236}
.avance{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;border:1px solid var(--pitch)!important;background:linear-gradient(120deg,#151b2c,#0f131b)!important}
.av-num{display:flex;flex-direction:column;align-items:center;min-width:96px}
.av-num b{font-family:var(--f-display);font-size:72px;line-height:.9;color:var(--pitch);font-weight:700}
.av-msg{margin:0 0 8px;font-family:var(--f-display);font-size:22px;letter-spacing:.02em}
.av-sub{margin:8px 0 0;font-size:13px;color:var(--muted)}
.av-btn{font-size:17px;padding:14px 22px;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
@media (max-width:620px){.avance{grid-template-columns:auto minmax(0,1fr)}.av-btn{grid-column:1/-1;width:100%}.av-num b{font-size:56px}.av-num{min-width:70px}}
.mis{margin-top:12px}
.mis summary{cursor:pointer;display:flex;align-items:center;gap:8px}
.ev-list{list-style:none;margin:10px 0 0;padding:0}
.ev{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.ev-n{flex:1;min-width:0;font-weight:600}
.rk-zero{color:#a8894a}
.me-btn[aria-current="page"]{border-color:var(--pitch);box-shadow:0 0 0 2px var(--pitch)}
.p7.on{box-shadow:0 0 0 3px rgba(217,178,90,.45)}
input[type=checkbox]{accent-color:var(--pitch)}

.lang{display:flex;gap:2px;margin-bottom:4px;background:rgba(15,19,27,.8);border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:var(--muted);font-family:var(--f-display);font-size:12px;letter-spacing:.08em;padding:4px 8px;border-radius:99px}
.lang button[aria-pressed="true"]{background:var(--pitch);color:#07090d}
#me-slot{display:flex;align-items:flex-end;gap:8px}
@media (max-width:620px){.lang button{padding:3px 6px;font-size:11px}}
@media (max-width:620px){
 header.top.hero .right{flex-wrap:wrap}
 #me-slot{position:absolute;top:12px;right:12px;align-items:center}
 #me-slot .lang{margin:0}
 #me-slot .me-btn{margin:0}
 .top .brand{padding-right:112px}
 nav.tabs{width:100%;justify-content:space-between}
}

/* lista de convocados: sin scroll propio, check redondo */
.plist{max-height:none;overflow:visible}
.plist input[type=checkbox]{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;cursor:pointer;margin:0;flex:none}
.plist input[type=checkbox]::after{content:"";width:6px;height:11px;border:solid #07090d;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.plist input[type=checkbox]:checked{background:var(--pitch);border-color:var(--pitch)}
.plist input[type=checkbox]:checked::after{opacity:1}
.plist input[type=checkbox]:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.pill.adm{color:var(--pitch);border-color:var(--pitch);background:none;margin-left:4px}

/* --- web propia: login --- */
body.needlogin nav.tabs, body.needlogin .me-btn{display:none}
.login{max-width:440px;margin:40px auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.login .crest-big{width:150px;height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.login h2{font-family:var(--f-script);font-weight:400;font-size:44px;color:var(--pitch);text-transform:none;letter-spacing:0}
.login p{margin:0;color:var(--muted);max-width:36ch}
.gbtn{display:inline-flex;align-items:center;gap:10px;font-size:17px;padding:14px 22px;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.gbtn svg{width:20px;height:20px;background:#fff;border-radius:50%;padding:2px}
.signout{margin-top:18px;text-align:right}

/* ---------- Balanceo ---------- */
const KEYS=['f','arq','ata','def','fis','jue','morf','hab','cal'];
function prep(ids){return ids.map(id=>{const s=S.stats[id];return{id,f:s.f,arq:s.v.arq,ata:s.cats.ata,def:s.cats.def,fis:s.cats.fis,jue:s.cats.jue,morf:s.v.eq<=2.3?1:0,hab:s.v.hab>=3.7?1:0,cal:s.v.cal>=3.5?1:0};});}
function balance(ids){
  const P=prep(ids),n=P.length;
  const tot={};KEYS.forEach(K=>tot[K]=P.reduce((a,p)=>a+p[K],0));
  const ix=new Map(ids.map((id,i)=>[id,i]));
  const mapPairs=l=>l.map(([a,b])=>[ix.get(a),ix.get(b)]).filter(([a,b])=>a!=null&&b!=null);
  const sep=mapPairs(S.rules.sep),jun=mapPairs(S.rules.jun);
  const last=S.matches.find(m=>m.a&&m.b);
  const lastSide=ids.map(id=>!last?0:last.a.includes(id)?1:last.b.includes(id)?2:0);
  const common=lastSide.filter(x=>x).length;
  const inA=new Uint8Array(n),combo=[],top=[],MAXT=80;let worst=Infinity;
  function evalC(){
    const nA=combo.length,nB=n-nA,sA={};
    for(const K of KEYS)sA[K]=0;
    for(const i of combo){const p=P[i];for(const K of KEYS)sA[K]+=p[K];}
    const d=K=>Math.abs(sA[K]/nA-(tot[K]-sA[K])/nB);
    const dc=K=>Math.abs(sA[K]-(tot[K]-sA[K]));
    let c=3*d('f')+1.2*d('arq')+0.6*(d('ata')+d('def')+d('fis')+d('jue'))+0.25*(dc('morf')+dc('cal')+dc('hab'));
    if(tot.hab>=2&&(sA.hab===0||sA.hab===tot.hab))c+=0.5;
    for(const [a,b] of sep)if(inA[a]===inA[b])c+=5;
    for(const [a,b] of jun)if(inA[a]!==inA[b])c+=5;
    if(common>=8){let same=0;for(let i=0;i<n;i++)if(lastSide[i])same+=(lastSide[i]===1)===(inA[i]===1)?1:0;const sim=Math.max(same,common-same)/common;if(sim>0.85)c+=0.4*(sim-0.85)/0.15;}
    if(c<worst||top.length<MAXT){top.push({c,a:combo.slice()});top.sort((x,y)=>x.c-y.c);if(top.length>MAXT)top.pop();worst=top[top.length-1].c;}
  }
  function rec(start,k){if(combo.length===k){evalC();return;}for(let i=start;i<=n-(k-combo.length);i++){inA[i]=1;combo.push(i);rec(i+1,k);combo.pop();inA[i]=0;}}
  const k=Math.floor(n/2),sizes=n%2?[k,k+1]:[k];
  for(const sz of sizes){inA[0]=1;combo.length=0;combo.push(0);rec(1,sz);inA[0]=0;}
  for(const t of top){const A=new Set(t.a),ta=ids.filter((_,i)=>A.has(i)),tb=ids.filter((_,i)=>!A.has(i)),f=formAll(ta,tb);const la={fit:teamLines(ta,f)},lb={fit:teamLines(tb,f)};
    t.c+=1.0*(Math.abs(la.fit.D-lb.fit.D)+Math.abs(la.fit.M-lb.fit.M)+Math.abs(la.fit.A-lb.fit.A));}
  top.sort((x,y)=>x.c-y.c);
  const chosen=[],limit=top.length?top[0].c+0.5:0;
  for(const t of top){
    if(t.c>limit)break;
    const A=new Set(t.a);
    const ok=chosen.every(o=>{const B=new Set(o.a);let diff=0;for(let i=0;i<n;i++)if(A.has(i)!==B.has(i))diff++;return Math.min(diff,n-diff)>=4;});
    if(ok)chosen.push(t);if(chosen.length===8)break;
  }
  return chosen.map(t=>{const A=new Set(t.a);return{c:t.c,a:ids.filter((_,i)=>A.has(i)),b:ids.filter((_,i)=>!A.has(i))};});
}
function teamMetrics(ids){
  const P=ids.map(id=>S.stats[id]).filter(Boolean);
  return{f:avg(P.map(s=>s.f)),arq:avg(P.map(s=>s.v.arq)),fis:avg(P.map(s=>s.cats.fis)),
    morf:P.filter(s=>s.v.eq<=2.3).length,hab:P.filter(s=>s.v.hab>=3.7).length,cal:P.filter(s=>s.v.cal>=3.5).length};
}

/* ---------- Avatares y fotos ---------- */
const AVC=['#1d2b6b','#2b48c8','#3a4f8f','#6b5320','#8a6a28','#22305e','#2140a8','#4d3e17','#304a9c','#5c4a1a'];
const avColor=n=>AVC[hue(n)%AVC.length];
function hue(s){let h=0;for(const c of String(s||''))h=(h*31+c.charCodeAt(0))%360;return h;}
function initials(n){const w=String(n||'').split(/\s+/).map(x=>x.replace(/[^\p{L}\p{N}]/gu,'')).filter(Boolean);if(!w.length)return'?';return(w[0][0]+(w[1]?w[1][0]:(w[0][1]||''))).toUpperCase();}
function shortName(id,ids){const w=String(name(id)).split(/\s+/).map(x=>x.replace(/[^\p{L}\p{N}.]/gu,'')).filter(Boolean);if(!w.length)return name(id);const f=w[0];const dup=ids&&ids.some(o=>o!==id&&String(name(o)).split(/\s+/)[0].replace(/[^\p{L}\p{N}.]/gu,'')===f);return dup&&w[1]?f+' '+w[1][0]+'.':f;}
function av(id,cls=''){
  const p=S.players.get(id)||{},ph=info(id).photo,st=`--av:${avColor(p.name)}`;
  const src=ph?photoSrc(ph):'';
  return src?`<span class="av ${cls}" style="${st}"><img src="${src}" alt="" loading="lazy" onerror="this.remove()"></span>`
    :`<span class="av ${cls} ${cls.includes('np')?'nophoto':''}" style="${st}" aria-hidden="true">${esc(initials(p.name))}</span>`;
}
const bday=id=>isBday(info(id))?' 🎂':'';
async function resizePhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const side=Math.min(img.naturalWidth,img.naturalHeight),c=document.createElement('canvas');c.width=c.height=400;
    c.getContext('2d').drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,400,400);
    return await new Promise(res=>c.toBlob(res,'image/jpeg',0.86));
  }finally{URL.revokeObjectURL(url);}
}
function photoErr(e){toast(e&&e.code==='too_large'?'La foto es muy pesada':e&&e.code==='unsupported_type'?'Ese formato no sirve, probá con JPG o PNG':'No se pudo subir la foto. Probá de nuevo.');}
async function uploadBlob(file){const blob=await resizePhoto(file);if(!blob)throw{code:'invalid_request'};return S.assets.upload(blob,{type:'image/jpeg'});}
/* foto al agregar un jugador (lo hace quien lo carga) */
async function uploadPlayerPhoto(id,file){
  if(!S.assets){toast('No tenés permiso para subir fotos');return;}
  S.uploading=id;render();
  try{const r=await uploadBlob(file);await S.db.doc('players/'+id).update({photo:r.id});if(S.photoFor===id)S.photoFor=null;toast('Foto guardada');}
  catch(e){photoErr(e);}
  S.uploading=null;render();
}


/* ---------- Fotos (Firestore + caché en el navegador) ---------- */
const PH=new Map(),PH_WAIT=new Set();let PH_T=null;
const idb=(()=>{let p=null;return()=>p||(p=new Promise(res=>{try{const r=indexedDB.open('fulbo-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(_){res(null);}}));})();
async function idbGet(k){const d=await idb();if(!d)return null;return new Promise(res=>{try{const q=d.transaction('p').objectStore('p').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(_){res(null);}});}
async function idbPut(k,v){const d=await idb();if(!d)return;try{d.transaction('p','readwrite').objectStore('p').put(v,k);}catch(_){}}
function dataUrlToObjUrl(du){try{const [h,b]=du.split(',');const mime=h.slice(5,h.indexOf(';'));const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return URL.createObjectURL(new Blob([u],{type:mime}));}catch(_){return du;}}
function photoSrc(id){
  if(!id)return'';
  if(PH.has(id))return PH.get(id);
  if(!PH_WAIT.has(id)&&S.db){PH_WAIT.add(id);(async()=>{
    let du=await idbGet(id);
    if(!du){try{const s=await S.db.doc('photos/'+id).get();if(s.exists){du=s.data().d;idbPut(id,du);}}catch(_){}}
    PH.set(id,du?dataUrlToObjUrl(du):'');PH_WAIT.delete(id);
    clearTimeout(PH_T);PH_T=setTimeout(render,60);})();}
  return'';
}
function blobToDataUrl(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
async function shrinkCard(blob){
  const url=URL.createObjectURL(blob);
  try{const img=await loadImg(url);
    for(const [w,q] of [[640,.86],[560,.8],[480,.75],[400,.7]]){
      const h=Math.round(w*1.25),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      let du=c.toDataURL('image/webp',q);if(!du.startsWith('data:image/webp'))du=c.toDataURL('image/png');
      if(du.length<900000)return du;}
    throw{code:'too_large'};
  }finally{URL.revokeObjectURL(url);}
}
const photoStore={
  async upload(blob,opt){
    let du=(opt&&opt.type==='image/png')?await shrinkCard(blob):await blobToDataUrl(blob);
    if(du.length>950000)throw{code:'too_large'};
    const ref=await S.db.collection('photos').add({d:du,by:S.uid,t:Date.now()});
    PH.set(ref.id,dataUrlToObjUrl(du));idbPut(ref.id,du);
    return{id:ref.id};
  },
  async delete(id){try{await S.db.doc('photos/'+id).delete();}catch(_){}}
};

  const pos=posLabel(id,inf);

    .map(([k,a])=>`<span><b class="num">${to99(avg(a))}</b>${k}</span>`).join('');
  const ph=inf.photo&&photoSrc(inf.photo)?`<img src="${photoSrc(inf.photo)}" alt="" onerror="this.remove()">`:`<span>${esc(initials(p.name))}</span>`;

  return`<div class="pcard ${tier} ${S.flip===id?'flipped':''}" data-act="flip" data-id="${id}" role="button" tabindex="0" aria-label="Carta de ${esc(p.name)}, tocá para darla vuelta">
  <div class="pc-in">
   <div class="pc-face pc-front">
    <div class="pc-top">
     <div class="pc-side"><b class="pc-r num">${r}</b><span class="pc-pos">${pos}</span>${inf.nat?flag(inf.nat):''}${inf.dorsal?`<span class="pc-dor num">#${esc(inf.dorsal)}</span>`:''}</div>
     <div class="pc-photo ${cutSrc?'has-cut':''}" style="--av:${avColor(p.name)}">${cutSrc?`<img class="cut" src="${esc(cutSrc)}" alt="" onerror="this.remove()">`:ph}</div>
    </div>
    <div class="pc-name">${esc(p.name)}${isBday(inf)?' 🎂':''}${full?'<span class="seal" title="Carta completa">✓</span>':''}</div>
    <div class="pc-stats">${st}</div>
    <div class="pc-foot"><div class="pc-meta">${meta}</div>${vbar(s.n,true)}</div>
   </div>
   <div class="pc-face pc-back">
    <span class="pc-tier">${tier}</span><div class="pc-name">${esc(p.name)}</div>
    ${back.length?`<dl>${back.map(([k,val])=>`<dt>${k}</dt><dd>${esc(val)}</dd>`).join('')}</dl>`:''}
    ${inf.frase?`<blockquote>“${esc(inf.frase)}”</blockquote>`:''}
    ${!back.length&&!inf.frase?'<p class="pc-empty">Todavía no armó su perfil.</p>':''}
    <span class="pc-hint">Tocá para volver</span>
   </div>
  </div></div>`;
}

  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab?'true':'false'));

  if(!S.ready){m.innerHTML='<div class="empty">Cargando el plantel…</div>';return;}
  const ae=document.activeElement,fid=ae&&ae.id&&m.contains(ae)?ae.id:null;

}
function vTeams(n){
  S._verd='';
  const head=`<div class="cancha-head"><h2 style="font-size:26px;text-transform:uppercase">Equipos</h2>
    <div class="row">${(S.pasteReview||[]).length?`<span class="warn-armar">Hay ${S.pasteReview.length} ${S.pasteReview.length===1?'nombre':'nombres'} sin revisar</span>`:''}<button class="btn bib" data-act="armar" ${n<4||n>MAX_N||S.busy?'disabled':''} title="${S.teams?'Mezcla de nuevo: otra combinación igual de pareja':''}">${S.busy?'Calculando…':S.teams?'🔀 Volver a armar':'Armar equipos'}</button></div></div>`;
  if(!S.teams){
    const msg=n<4?'Pegá la lista o marcá a los que juegan':n>MAX_N?`Máximo ${MAX_N} jugadores`:`${n} convocados listos`;
    return head+`<div class="cancha-empty" data-drop="A"><strong>${msg}</strong>Se prueban todas las combinaciones posibles y queda la más pareja, con posiciones sugeridas y turnos de arco.<br>Después podés mover jugadores a mano arrastrándolos o con ⇄.</div>`;
  }
  const {a,b,ord,form}=S.teams,LA=layoutTeam(a,ord,form),LB=layoutTeam(b,ord,form),mA=teamMetrics(a),mB=teamMetrics(b),fl=formAll(a,b),QA=teamLines(a,fl),QB=teamLines(b,fl);
  const TN={A:'Con pechera',B:'Sin pechera'};
  const XS={G:8,D:20,M:32,A:44};
  const marks=(side,ids,L)=>{const out=[];for(const r of ['G','D','M','A']){const sd=id=>{const v=SIDE_OF[info(id).pos];return v===undefined?1:v;};const line=ids.filter(id=>L.pos[id]===r).sort((x,y)=>(side==='A'?sd(x)-sd(y):sd(y)-sd(x))||ord[x]-ord[y]);
    line.forEach((id,i)=>{const x=side==='A'?XS[r]:100-XS[r];const y=10+(i+1)*80/(line.length+1);
      out.push(`<div class="mk ${side} ${r==='G'?'gk':''} ${S.profile===id?'sel':''}" style="--x:${x};--y:${y.toFixed(1)}" draggable="true" data-drag="${id}" data-act="profile" data-id="${id}" title="${esc(name(id))} · ${ROL_N[r]}">${av(id)}<span class="n num">${ord[id]}</span><span class="t">${esc(shortName(id,ids))}${bday(id)}</span></div>`);});}
    return out.join('');};
  const pitch=`<div class="pitch-wrap">
   <div class="pitch-note"><span>Formación propuesta: <strong>${form}</strong></span><span class="muted">El 1 arranca al arco y cada ${MINS}' pasa el siguiente</span></div>
   <div class="pitch" role="img" aria-label="Cancha con las posiciones sugeridas">
    <svg class="lines h" viewBox="0 0 160 90" aria-hidden="true"><g fill="none" stroke="rgba(255,255,255,.75)" stroke-width=".6"><rect x="3" y="3" width="154" height="84"/><line x1="80" y1="3" x2="80" y2="87"/><circle cx="80" cy="45" r="10"/><rect x="3" y="25" width="18" height="40"/><rect x="139" y="25" width="18" height="40"/><rect x="3" y="36" width="7" height="18"/><rect x="150" y="36" width="7" height="18"/></g></svg>
    <svg class="lines v" viewBox="0 0 100 150" aria-hidden="true"><g fill="none" stroke="rgba(255,255,255,.75)" stroke-width=".6"><rect x="3" y="3" width="94" height="144"/><line x1="3" y1="75" x2="97" y2="75"/><circle cx="50" cy="75" r="10"/><rect x="25" y="3" width="50" height="18"/><rect x="25" y="129" width="50" height="18"/><rect x="36" y="3" width="28" height="7"/><rect x="36" y="140" width="28" height="7"/></g></svg>
    <div class="half A" data-drop="A"></div><div class="half B" data-drop="B"></div>
    ${marks('A',a,LA)}${marks('B',b,LB)}
   </div>
   <div class="legend"><span>Anillo azul: con pechera · blanco: sin pechera</span><span>Borde dorado: arranca al arco</span><span>Anillo verde: el que estás viendo</span></div>
  </div>`;
  const col=(side,ids,L,m)=>`<div class="team ${side}" data-drop="${side}">
    <div class="team-h"><h3>${TN[side]}</h3><span class="avg num" title="Nivel promedio">${to99(m.f)}</span></div>
    <ul class="chips">${ids.slice().sort((x,y)=>ord[x]-ord[y]).map(id=>chip(id,ord[id],L.pos[id])).join('')}</ul></div>`;
  const rowsData=[['Nivel',mA.f,mB.f],['Arquero',mA.arq,mB.arq],['Defensa',QA.D,QB.D],['Medio',QA.M,QB.M],['Ataque',QA.A,QB.A],['Físico',mA.fis,mB.fis]];
  const rows=rowsData.map(([lab,x,y])=>{const d=Math.abs(x-y);const cl=d<0.15?'g':d<0.35?'w':'x';
    return`<tr><td>${lab}</td><td class="a num">${to99(x)}</td><td class="b num">${to99(y)}</td><td class="dif ${cl} num">${dif99(d)<1?'=':dif99(d)}</td></tr>`;}).join('');
  const dF=Math.abs(mA.f-mB.f);
  const verdict=dF<0.08?['Muy parejo','g']:dF<0.2?['Parejo','g']:dF<0.4?['Algo desparejo','w']:['Desparejo','x'];
  const warns=[];
  if(Math.abs(a.length-b.length)>1)warns.push('Los equipos tienen distinta cantidad de jugadores.');
  for(const [r,lab] of [['D','defensa'],['M','el medio'],['A','ataque']]){const d=QA[r]-QB[r];if(Math.abs(d)>0.5)warns.push(`${d<0?TN.A:TN.B} queda flojo en ${lab}.`);}
  if(mA.hab+mB.hab>=2&&(!mA.hab||!mB.hab))warns.push('Un equipo no tiene a nadie que hable y ordene.');
  if(Math.abs(mA.cal-mB.cal)>=2&&isAdmin())warns.push('Los que se calientan quedaron cargados de un lado.');
  for(const [x,y] of S.rules.sep)if((a.includes(x)&&a.includes(y))||(b.includes(x)&&b.includes(y)))warns.push(`${esc(name(x))} y ${esc(name(y))} quedaron juntos (marcados para separar).`);
  for(const [x,y] of S.rules.jun)if((a.includes(x)&&b.includes(y))||(b.includes(x)&&a.includes(y)))warns.push(`${esc(name(x))} y ${esc(name(y))} quedaron separados (marcados para juntar).`);
  const VERD=`<span class="big dif ${verdict[1]}">${verdict[0]}</span><span class="muted vd-d">Diferencia de nivel: <strong class="num">${dif99(dF)}</strong> ${dif99(dF)===1?'punto':'puntos'}${S.manual?' · <span class="pill">Modificado a mano</span>':''}</span>
   <span class="row vd-b"><button class="btn small" data-act="copy">Copiar para WhatsApp</button>${!canManage()?'':`<button class="btn small primary" data-act="save-match">Guardar partido</button>`}</span>`;
  S._verd=VERD;
  return head+pitch+`<div class="teams">${col('A',a,LA,mA)}${col('B',b,LB,mB)}</div>
   <div class="verdict verdict-top">${VERD}</div>
   ${warns.length?`<ul class="warns">${warns.map(w=>`<li>${w}</li>`).join('')}</ul>`:''}
   <div class="metrics"><table><thead><tr><th></th><th>Con pechera</th><th>Sin pechera</th><th>Diferencia</th></tr></thead><tbody>${rows}</tbody></table></div>
   ${vPartidos()}`;
}
function chip(id,no,pos){
  const s=S.stats[id];
  return`<li class="chip ${S.profile===id?'sel':''}" draggable="true" data-drag="${id}" data-act="profile" data-id="${id}">
   <span class="no num ${no===1?'gk':''}" title="${no===1?'Arranca al arco':'Turno de arco '+no}">${no}</span>${av(id)}
   <span class="nm">${esc(name(id))}${bday(id)}</span><span class="rol">${ROL[pos]||''}</span><span class="lvl num">${to99(s.f)}</span>
   <button class="mv" data-act="move" data-id="${id}" title="Pasar al otro equipo" aria-label="Pasar a ${esc(name(id))} al otro equipo">⇄</button></li>`;
}
function bar2(label,val,max,o={}){const pct=max?Math.min(val,max)/max*100:0;
  return`<div class="b2 ${o.lv||''}"><div class="b2-h"><span class="label">${label}</span><span class="b2-v num">${o.txt??val}</span></div><div class="b2-t"><i style="width:${pct}%"></i>${(o.ticks||[]).map(x=>`<b style="left:${x/max*100}%"></b>`).join('')}</div></div>`;}
function emitted(id){if(id===S.myClaim)return S.mine.rated.length;const uid=S.claims.get(id);if(!uid)return null;return +(S.profiles.get(uid)||{}).votos||0;}
function voteBars(id){const s=S.stats[id],n=s?s.n:0,[lt,lc]=vlevel(n),em=emitted(id),tot=Math.max(1,activeIds().length-1);
  return bar2('Votos recibidos',n,OPT_V,{lv:lc,ticks:[MIN_V,FULL_V],txt:`${n} · ${lt}`})+bar2('Votos emitidos',em??0,tot,{txt:em==null?'sin cuenta':`${em} de ${tot}`});}
function vFicha(){

   <details class="paste"><summary>Ver los 16 ítems de la encuesta</summary>${Object.keys(GRUPOS).map(g=>`<div class="grp"><span class="label">${GRUPOS[g]}</span>${grp(g)}</div>`).join('')}</details>`;
}
function vPartidos(){

function fmtDate(d){try{return new Date(d).toLocaleDateString(LOCALE[S.lang],{weekday:'short',day:'numeric',month:'short'});}catch(e){return d;}}
function vReglas(){

  const adder=k=>ro?'':`<div class="row" style="margin-top:6px"><select id="${k}1" aria-label="Jugador 1">${opts}</select><select id="${k}2" aria-label="Jugador 2">${opts}</select><button class="btn small" data-act="addpair" data-kind="${k}">Agregar</button></div>`;

    <div style="margin-top:12px"><span class="label">Juntar</span><p class="muted" style="font-size:12px;margin:0">Siempre en el mismo equipo.</p>${pairList(S.rules.jun,'jun')}${adder('jun')}</div>

/* ----- Encuesta ----- */
function vEncuesta(){
  const intro=`<div class="intro"><h2>Encuesta del plantel</h2><p>Puntuá a los que conocés. Es anónima: tu voto no queda asociado a tu nombre. Te aparecen ${TANDA} jugadores por tanda, unos 4 minutos. La referencia es siempre <strong>el promedio del grupo</strong>: 3 es un jugador promedio de este grupo.</p></div>`;
  if(S.demo)return`<div class="enc">${intro}<div class="card"><p style="margin:0">La encuesta se habilita cuando cargues el plantel real. En el modo ejemplo no se guardan votos.</p></div>${vRanking()}</div>`;
  if(!S.db||!S.uid)return`<div class="enc">${intro}<div class="card"><p style="margin:0">Para votar tenés que abrir esta página con tu cuenta y tener permiso para editarla. Pedile al organizador que te invite.</p></div></div>`;
  if(!S.players.size)return`<div class="enc">${intro}${emptyPlantel()}</div>`;
  if(!S.myClaim)return`<div class="enc">${intro}<div class="card"><span class="label">Antes de votar</span><p style="margin:6px 0 12px">Decinos quién sos, así no te aparecés a vos mismo en la encuesta.</p><button class="btn bib" data-act="tab" data-tab="yo">Ir a Mi ficha</button></div>${vRanking()}</div>`;
  const done=S.mine.rated.length;
  if(!S.survey){
    const left=surveyPool().length;
    return`<div class="enc">${intro}${vAvance()}${vMisEvals()}${vRanking()}</div>`;
    return`<div class="enc">${intro}<div class="card"><div class="row" style="justify-content:space-between"><div><span class="label">Tu avance</span><p style="margin:4px 0 0">Evaluaste a <strong class="num">${done}</strong> ${done===1?'jugador':'jugadores'}. Te quedan <strong class="num">${left}</strong>.</p></div>
     <button class="btn bib" data-act="start" ${left?'':'disabled'}>${left?(done?'Otra tanda':'Empezar'):'¡Listo, no queda nadie!'}</button></div></div>${vRanking()}</div>`;
  }
  const {queue,i,edit,known}=S.survey,id=queue[i];
  const answered=Object.keys(S.ans).length,canSave=S.ans.gen&&answered>=8;
  const grp=g=>`<div class="qgrp"><span class="label">${GRUPOS[g]}</span>${ITEMS.filter(it=>it.g===g).map(it=>`<div class="q ${it.inv?'inv':''}">
    <span class="qn">${it.n}${it.inv?'<small>acá 5 no es bueno</small>':''}${it.k==='arq'?'<small style="color:var(--muted)">si nunca lo viste atajar, dejalo vacío</small>':''}</span>
    <span class="scale" role="group" aria-label="${it.n}">${[1,2,3,4,5].map(v=>`<button data-act="ans" data-k="${it.k}" data-v="${v}" aria-pressed="${S.ans[it.k]===v}">${v}</button>`).join('')}</span>
    <span class="anch"><span>1 · ${it.lo}</span><span>${it.hi} · 5</span></span></div>`).join('')}</div>`;
  return`<div class="enc"><div class="card">
   <div class="eval-h"><div class="row" style="flex-wrap:nowrap">${av(id,'lg')}<div><span class="label">${edit?'Editando tu evaluación':known?'Nueva evaluación':`Jugador ${i+1} de ${queue.length}`}</span><h2>${esc(name(id))}</h2></div></div>
    <div class="prog">${queue.map((_,j)=>`<i class="${j<i?'done':j===i?'cur':''}"></i>`).join('')}</div></div>
   ${Object.keys(GRUPOS).map(grp).join('')}
   <div class="eval-f"><button class="btn ghost" data-act="skip">${edit||known?'Cancelar':'No lo conozco lo suficiente'}</button>
    <div class="row"><span class="muted" style="font-size:13px">${canSave?'':S.ans.gen?`Faltan ${8-answered} respuestas`:'Falta el nivel general'}</span><button class="btn primary" data-act="save-vote" ${canSave?'':'disabled'}>${edit?'Guardar cambios':i+1<queue.length?'Guardar y seguir':'Guardar y terminar'}</button></div></div>
  </div></div>`;
}
function vRanking(){
  const act=new Set(activeIds()),total=act.size;
  const rows=[...S.claims.entries()].filter(([pid])=>act.has(pid)).map(([pid,uid])=>{const pr=S.profiles.get(uid)||{};return{pid,v:+pr.votos||0,sk:+pr.pasados||0};});
  rows.sort((a,b)=>b.v-a.v||name(a.pid).localeCompare(name(b.pid),'es'));
  const max=Math.max(1,...rows.map(r=>r.v)),voters=rows.filter(r=>r.v>0),zero=rows.filter(r=>r.v===0);
  const unclaimed=sortedIds([...act].filter(id=>!S.claims.has(id)));
  const badge=r=>{if(r.v>0&&r.v+r.sk>=total-1)return'DT del grupo';for(const [m,t] of BADGES)if(r.v>=m)return t;return'';};
  const medal=i=>i<3?`<span class="rk-m" aria-label="Puesto ${i+1}">${['🥇','🥈','🥉'][i]}</span>`:`<span class="rk-m rk-n num">${i+1}</span>`;
  const li=(r,i)=>{const b=badge(r),me=r.pid===S.myClaim;return`<li class="rk ${me?'me':''}">${medal(i)}${av(r.pid)}<span class="rk-name">${esc(name(r.pid))}${me?' <span class="pill">vos</span>':''}${b?` <span class="pill rk-b">${b}</span>`:''}</span>
     <span class="rk-bar"><i style="width:${r.v/max*100}%"></i></span><strong class="rk-v num">${r.v}</strong></li>`;};
  return`<div class="card ranking"><div class="row" style="justify-content:space-between;align-items:baseline"><h3 style="font-size:24px;text-transform:uppercase">Ranking de encuestadores</h3></div>
   ${voters.length?`<ol class="rk-list">${voters.map(li).join('')}</ol>`:'<p class="muted" style="margin:8px 0 0">Todavía nadie votó. ¡Estrenalo vos!</p>'}
   ${zero.length?`<p class="label rk-zero" style="margin:14px 0 4px">Todavía no votó</p><ul class="rk-list zero">${zero.map(r=>`<li class="rk">${av(r.pid)}<span class="rk-name">${esc(name(r.pid))}${r.pid===S.myClaim?' <span class="pill">vos</span>':''}</span><span class="pill">0</span></li>`).join('')}</ul>`:''}
   ${unclaimed.length?`<p class="muted" style="font-size:12px;margin:12px 0 0"><strong>Sin cuenta todavía (${unclaimed.length}):</strong> ${unclaimed.slice(0,25).map(id=>esc(name(id))).join(', ')}${unclaimed.length>25?` y ${unclaimed.length-25} más`:''}. No pueden votar hasta que entren y reclamen su ficha.</p>`:''}
   <p class="muted" style="font-size:11px;margin:10px 0 0">Solo se muestra la cantidad. Nunca a quién evaluó cada uno ni qué notas puso.</p></div>`;
}
function myRank(){const act=new Set(activeIds());const rows=[...S.claims.entries()].filter(([pid])=>act.has(pid)).map(([pid,uid])=>({pid,v:pid===S.myClaim?S.mine.rated.length:+(S.profiles.get(uid)||{}).votos||0}));rows.sort((a,b)=>b.v-a.v);return rows.findIndex(r=>r.pid===S.myClaim)+1;}
async function syncMyCount(){
  if(S.demo||!S.db||!S.uid||!S.myClaim||S._syncing)return;
  const pr=S.profiles.get(S.uid);if(!pr)return;
  const v=S.mine.rated.length,k=S.mine.skip.length;
  if(pr.votos===v&&pr.pasados===k)return;
  S._syncing=true;try{await S.db.doc('profiles/'+S.uid).update({votos:v,pasados:k});}catch(_){}S._syncing=false;
}
function surveyTotal(){return activeIds().filter(id=>id!==S.myClaim).length;}
function vAvance(){
  const total=surveyTotal(),left=surveyPool().length,act=new Set(activeIds());
  const done=S.mine.rated.filter(id=>act.has(id)).length,sk=S.mine.skip.filter(id=>act.has(id)).length,pct=total?Math.round((total-left)/total*100):0;
  const msg=!left?'¡Completaste el plantel! 🏆':!done&&!sk?'¡Arrancá, tu voto es clave!':left<=3?`¡Te ${left===1?'queda solo 1':`quedan solo ${left}`}!`:pct>=50?'Pasaste la mitad 💪':'Cada voto hace los equipos más parejos';
  return`<div class="card avance"><div class="av-num"><span class="label">${left?'Te faltan':'Listo'}</span><b class="num">${left||'✓'}</b></div>
   <div class="av-mid"><p class="av-msg">${msg}</p><div class="b2-t thick"><i style="width:${pct}%"></i></div>
    <p class="av-sub num">${total-left} de ${total} · evaluaste ${done} · salteaste ${sk}</p></div>
   ${left?`<button class="btn bib av-btn" data-act="start">${done||sk?'Seguir puntuando':'Empezar a puntuar'}</button>`:''}</div>`;
}
function vMisEvals(){
  const act=new Set(activeIds()),rated=S.mine.rated.filter(id=>act.has(id)),sk=S.mine.skip.filter(id=>act.has(id));
  if(!rated.length&&!sk.length)return'';
  const vids=S.mine.vids||{};
  const row=(id,btn)=>`<li class="ev">${av(id)}<span class="ev-n">${esc(name(id))}</span>${btn}</li>`;
  return`<details class="card mis" id="mis-evals"${S.misOpen?' open':''}><summary><span class="label">Mis evaluaciones</span> <span class="pill">${rated.length+sk.length}</span></summary>
   <ul class="ev-list">${sortedIds(rated.slice()).map(id=>row(id,vids[id]?`<button class="btn small" data-act="ev-edit" data-id="${id}">✎ Editar</button>`:`<span class="pill" title="Este voto es de antes de que se pudiera editar">Votado antes · no editable</span>`)).join('')}
   ${sortedIds(sk.slice()).map(id=>row(id,`<button class="btn small ghost" data-act="ev-known" data-id="${id}">Ahora sí lo conozco</button>`)).join('')}</ul></details>`;
}
function surveyPool(){const excl=new Set([...S.mine.rated,...S.mine.skip,S.myClaim]);return activeIds().filter(id=>!excl.has(id));}

/* ----- Plantel ----- */
function vPlantel(){
  const ids=sortedIds([...S.players.keys()]);
  const ro=!canManage(),canPhoto=!!S.assets&&!S.demo;
  const photoBtn=(id,txt)=>canPhoto?`<label class="btn small filebtn">${S.uploading===id?'Subiendo…':txt}<input type="file" accept="image/*" data-act="photo" data-id="${id}" aria-label="${txt} de ${esc(name(id))}" ${S.uploading?'disabled':''}></label>`:'';

async function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});}
/* Foto de jugador: 800x1000 PNG, se quita el fondo verde liso si lo tiene */
async function makeCardPhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url),W=800,H=1000,c=document.createElement('canvas');c.width=W;c.height=H;
    const ctx=c.getContext('2d'),sc=Math.max(W/img.naturalWidth,H/img.naturalHeight),w=img.naturalWidth*sc,h=img.naturalHeight*sc;
    ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);
    const data=ctx.getImageData(0,0,W,H),px=data.data;
    const at=(x,y)=>{const i=(y*W+x)*4;return[px[i],px[i+1],px[i+2],px[i+3]];};
    const corners=[at(4,4),at(W-5,4),at(4,Math.floor(H/2)),at(W-5,Math.floor(H/2))];
    const transparentBg=corners.filter(c=>c[3]<30).length>=2;
    const greenBg=!transparentBg&&corners.filter(([r,g,b,a])=>a>200&&g>90&&g>r*1.35&&g>b*1.35).length>=2;
    if(greenBg){
      for(let i=0;i<px.length;i+=4){const r=px[i],g=px[i+1],b=px[i+2],m=Math.max(r,b);
        if(g>70&&g>m*1.2){const k=Math.min(1,(g-m*1.2)/45);px[i+3]=Math.round(px[i+3]*(1-k));px[i+1]=Math.min(g,Math.round(m*1.05));}}
      ctx.putImageData(data,0,0);
    }
    const blob=await new Promise(res=>c.toBlob(res,'image/png'));
    return{blob,keyed:greenBg,transparent:transparentBg||greenBg};
  }finally{URL.revokeObjectURL(url);}
}

function runBalance(){
  const ids=[...S.sel].filter(id=>S.stats[id]);
  if(ids.length<4||ids.length>MAX_N)return;

  if(S.options.length&&S.optKey===key){S.opt=(S.opt+1)%S.options.length;const o=S.options[S.opt];setTeams({a:o.a,b:o.b});render();return;}

function moveTo(id,side){
  if(!S.teams)return;
  S.sel.add(id);
  let {a,b}=S.teams;a=a.filter(x=>x!==id);b=b.filter(x=>x!==id);
  (side==='A'?a:b).push(id);setTeams({a,b},true,true);
}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,k)=>k);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[n];}
const stripDim=w=>w.replace(/(cit[oa]|it[oa]|in|ucho|ucha)$/,'');
function simil(a,b){
  if(!a||!b)return 0;if(a===b)return 1;
  const r=(x,y)=>1-lev(x,y)/Math.max(x.length,y.length);
  let best=r(a,b);
  const ta=a.split(' '),tb=b.split(' ');
  for(const x of ta)for(const y of tb){
    if(x.length<2||y.length<2)continue;
    best=Math.max(best,r(x,y)*0.92);
    const sx=stripDim(x),sy=stripDim(y);
    if(sx.length>=3&&sy.length>=3)best=Math.max(best,r(sx,sy)*0.9);
    if(x.length>=3&&y.startsWith(x)||y.length>=3&&x.startsWith(y))best=Math.max(best,0.8);
  }
  return best;
}
function suggest(n,exclude){
  return activeIds().filter(id=>!exclude.has(id)).map(id=>[id,simil(n,norm(name(id)))]).filter(x=>x[1]>=0.55).sort((x,y)=>y[1]-x[1]).slice(0,3).map(x=>x[0]);
}
function doPaste(){
  const lines=(S.pasteTxt||'').split(/\n/).map(cleanLine).filter(Boolean);
  const all=activeIds().map(id=>[id,norm(name(id))]);
  const found=[],review=[];
  for(const l of lines){const n=norm(l);if(!n)continue;
    const exact=all.filter(([,nm])=>nm===n);
    if(exact.length===1){if(!found.includes(exact[0][0]))found.push(exact[0][0]);continue;}
    const cand=exact.length?exact:all.filter(([,nm])=>(nm.startsWith(n)||n.startsWith(nm))||n.split(' ').includes(nm)||nm.split(' ').includes(n));
    if(cand.length===1){if(!found.includes(cand[0][0]))found.push(cand[0][0]);continue;}
    if(cand.length>1){review.push({line:l,kind:'amb',sugg:cand.map(c=>c[0]).slice(0,4)});continue;}
    review.push({line:l,kind:'miss',sugg:suggest(n,new Set(found))});
  }
  found.forEach(id=>S.sel.add(id));
  S.pasteReview=review;S.pasteFound=found.length;
  S.pasteMsg=review.length?'':`Marqué <strong>${found.length}</strong> ✓`;
  resetTeams();render();
}

  UNSUB.push(db.collection('ratings').limit(1000).onSnapshot(s=>{const v=[];s.docs.forEach(d=>{const x=d.data()||{};for(const k in x)if(x[k]&&typeof x[k]==='object')v.push({p:d.id,r:x[k],_id:k});});if(S.demo)S.real.votes=v;else S.votes=v;got.v=true;done();},fail));
  UNSUB.push(db.collection('profiles').limit(1000).onSnapshot(s=>{const m=new Map();s.docs.forEach(d=>m.set(d.id,d.data()));if(S.demo&&S.real)S.real.profiles=m;else S.profiles=m;done();syncMyCount();},e=>console.error(e)));
  UNSUB.push(db.doc('staff/admins').onSnapshot(s=>{S.admins=new Set(s.exists?(s.data().uids||[]):[]);done();},e=>console.error(e)));
  UNSUB.push(db.doc('config/rules').onSnapshot(s=>{const r=s.exists?s.data():{};const f=l=>(l||[]).filter(o=>o&&o.a&&o.b).map(o=>[o.a,o.b]);const rules={sep:f(r.sep),jun:f(r.jun)};if(S.demo&&S.real)S.real.rules=rules;else S.rules=rules;done();},e=>console.error(e)));
  UNSUB.push(db.collection('matches').orderBy('d','desc').limit(10).onSnapshot(s=>{S.matches=s.docs.map(d=>({...d.data(),_id:d.id}));done();},e=>console.error(e)));
  UNSUB.push(db.collection(`users/${S.uid}/myvotes`).onSnapshot(s=>{const vids={};s.docs.forEach(d=>{vids[d.id]=(d.data()||{}).vid;});S.mine={...S.mine,rated:Object.keys(vids),vids};done();syncMyCount();},e=>console.error(e)));
  UNSUB.push(db.doc(`users/${S.uid}/meta/yo`).onSnapshot(s=>{S.mine={...S.mine,skip:s.exists?(s.data().skip||[]):[]};done();syncMyCount();},e=>console.error(e)));
}
(async()=>{
  let FB=null;try{FB=await window.__fb;}catch(_){}
  if(!FB){S.fbError=true;S.ready=true;render();return;}
  S.FB=FB;S.db=FB.db;S.assets=photoStore;
  FB.onAuth(u=>{
    if(!u){stopSubs();S.uid=null;S.owner=false;S.needLogin=true;S.ready=true;S.players=new Map();S.votes=[];S.profiles=new Map();S.mine={rated:[],skip:[],vids:{}};syncClaims();render();return;}
    S.needLogin=false;S.uid=u.uid;S.email=(u.email||'').toLowerCase();
    S.owner=!!u.emailVerified&&OWNER_EMAILS.includes(S.email);S.canWrite=true;
    S.ready=false;render();startSubs();
  });
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
